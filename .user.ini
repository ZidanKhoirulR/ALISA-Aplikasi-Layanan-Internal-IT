; ALISA - PHP Configuration for Shared Hosting / cPanel
; File ini dibaca otomatis oleh PHP-FPM (shared hosting, cPanel, dll.)

; Upload Limits
upload_max_filesize = 20M
post_max_size       = 25M
max_file_uploads    = 10

; Memory & Execution Limits
memory_limit        = 128M
max_execution_time  = 60
max_input_time      = 60

; Session
session.gc_maxlifetime = 7200
